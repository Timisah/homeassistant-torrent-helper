[project]
name = "ha-torrent-tools"
version = "0.1.0"
description = "Home Assistant custom integration: Jackett search and qBittorrent control for Assist"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:sugar"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["E501", "S101", "S311", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "F841"]
"custom_components/torrent_tools/const.py" = ["S105"]
